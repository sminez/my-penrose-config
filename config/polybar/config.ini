[global/wm]
margin-bottom = 0
margin-top = 0

[bar/eDP]
monitor = ${env:MONITOR:}
monitor-strict = false
override-redirect = true
bottom = false
fixed-center = true
width = 100%
height = 24
background = ${color.bg}
foreground = ${color.fg}
font-0 = "ProFontIIx Nerd Font:size=12;2"
font-1 = "Iosevka Nerd Font:size=16;2"
modules-left = logo workspaces
modules-center = title
modules-right = battery date tray
spacing = 0
dim-value = 1.0
wm-name = penrose

[bar/DisplayPort-1]
inherit = bar/eDP
; height = 18
font-0 = "ProFontIIx Nerd Font:size=10;2"
font-1 = "Iosevka Nerd Font:size=16;2"
modules-right = battery date

[color]
bg = #282828
fg = #EBDBB2
bg-alt = #1d2021
fg-alt = #F9F5D7
grey = #504945
light-grey = #928374

red = #CC241D
green = #B8BB26
yellow = #D79921
blue = #458588
purple = #B16286

[module/tray]
type = internal/tray
tray-spacing = 8px

[module/workspaces]
type = internal/xworkspaces
pin-workspaces = false

format = <label-state>
label-active-foreground = ${color.blue}
label-occupied-foreground = ${color.fg}
label-urgent-foreground = ${color.red}
label-empty-foreground = ${color.grey}

[module/logo]
type = custom/text

format = "  " 
format-background = ${color.blue}
format-foreground = ${color.fg}
format-padding = 0

[module/date]
type = internal/date

interval = 1.0
time = %I:%M %p
format = <label>
format-background = ${color.bg}
format-padding = 2
label = %time%

[module/title]
type = internal/xwindow

format = <label>
format-prefix = " "
format-prefix-foreground = ${color.blue}
label = %title%
label-maxlen = 30
label-empty = penrose

; [module/layout]
; type = custom/script
; exec = awk '/\[INFO\] ACTIVE_LAYOUT/ { print $4 }' /home/sminez/.penrose.log | tail -n1
; interval = 1
; format-padding = 1

[module/battery]
type = internal/battery

full-at = 99
low-at = 5
format-charging = <ramp-capacity> <label-charging>
format-discharging = <ramp-capacity> <label-discharging>
ramp-capacity-0 = 
ramp-capacity-1 = 
ramp-capacity-2 = 
ramp-capacity-3 = 
ramp-capacity-4 = 
bar-capacity-width = 10

; Use the following command to list batteries and adapters:
; $ ls -1 /sys/class/power_supply/
battery = BAT1
adapter = ADP1

; If an inotify event haven't been reported in this many
; seconds, manually poll for new values.
; Needed as a fallback for systems that don't report events
; on sysfs/procfs.
; Disable polling by setting the interval to 0.
; Default: 5
poll-interval = 5
